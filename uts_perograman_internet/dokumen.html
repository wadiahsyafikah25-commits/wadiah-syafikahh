<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Mata Kuliah</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse; 
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #cccccc; 
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: bold;
        }

        
        tbody tr:nth-child(odd) {
            background-color: #ffffff; 
        }

        tbody tr:nth-child(even) {
            background-color: #f2f5f8; 
        }

        
        tbody tr {
            cursor: pointer; 
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #d1ecf1; 
        }
    </style>
</head>
<body>

    <h2>Daftar Mata Kuliah</h2>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Kode Mata Kuliah</th>
                <th>Nama Mata Kuliah</th>
                <th>Jumlah SKS</th>
                <th>Semester</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>TIF301</td>
                <td>Pemrograman Python</td>
                <td>3</td>
                <td>5</td>
            </tr>
            <tr>
                <td>2</td>
                <td>TIF302</td>
                <td>Pemrograman Web</td>
                <td>3</td>
                <td>5</td>
            </tr>
            <tr>
                <td>3</td>
                <td>TIF303</td>
                <td>Administrasi Basis Data</td>
                <td>3</td>
                <td>5</td>
            </tr>
            <tr>
                <td>4</td>
                <td>TIF304</td>
                <td>Pemrograman Visual</td>
                <td>3</td>
                <td>5</td>
            </tr>
            <tr>
                <td>5</td>
                <td>TIF305</td>
                <td>Jaringan Komputer</td>
                <td>3</td>
                <td>5</td>
            </tr>
        </tbody>
    </table>

</body>
</html>

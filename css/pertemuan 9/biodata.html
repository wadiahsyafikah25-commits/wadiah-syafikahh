<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>biodata</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-4" style="max-width: 600px;">
    <form>
      <div class="mb-3">
        <label for="nama" class="form-label">Nama</label>
        <input type="text" class="form-control" id="nama">
      </div>

      <div class="mb-3">
        <label for="tempat" class="form-label">Tempat Lahir</label>
        <input type="text" class="form-control" id="tempat">
      </div>

      <div class="mb-3">
        <label for="tanggal" class="form-label">Tanggal Lahir</label>
        <input type="date" class="form-control" id="tanggal">
      </div>

      <div class="mb-3">
        <p class="mb-1">Hobi (bisa lebih dari 1 pilihan)</p>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="badminton">
          <label class="form-check-label" for="badminton">Badminton</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="membaca">
          <label class="form-check-label" for="membaca">Membaca</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="melukis">
          <label class="form-check-label" for="melukis">Melukis</label>
        </div>
      </div>

      <div class="mb-3">
        <p class="mb-1">Jenis Kelamin</p>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="jk" id="laki">
          <label class="form-check-label" for="laki">Laki-laki</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="jk" id="perempuan" checked>
          <label class="form-check-label" for="perempuan">Perempuan</label>
        </div>
      </div>

      <div class="mb-3">
        <label for="deskripsi" class="form-label">Deskripsi tentang kamu</label>
        <textarea class="form-control" id="deskripsi" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label for="agama" class="form-label">Agama</label>
        <select class="form-select" id="agama">
          <option>Islam</option>
          <option>Kristen</option>
          <option>Katolik</option>
          <option>Hindu</option>
          <option>Buddha</option>
          <option>Konghucu</option>
        </select>
      </div>

      <hr>

      <div class="input-group mb-3">
        <span class="input-group-text">@</span>
        <input type="text" class="form-control" placeholder="Username">
      </div>

      <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Recipient's username">
        <span class="input-group-text">@example.com</span>
      </div>

      <div class="mb-3">
        <label for="vanity" class="form-label">Your vanity URL</label>
        <div class="input-group">
          <span class="input-group-text">https://example.com/users/</span>
          <input type="text" class="form-control" id="vanity">
        </div>
        <div class="form-text">Example help text goes outside the input group.</div>
      </div>

      <div class="input-group mb-3">
        <span class="input-group-text">$</span>
        <input type="text" class="form-control">
        <span class="input-group-text">.00</span>
      </div>

      <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Username">
        <span class="input-group-text">@</span>
        <input type="text" class="form-control" placeholder="Server">
      </div>

      <div class="input-group mb-3">
        <span class="input-group-text">With textarea</span>
        <textarea class="form-control"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Simpan</button>
    </form>
  </div>
</body>
</html>
